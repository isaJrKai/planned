<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep teal to forest green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A4D5C"/>
      <stop offset="100%" stop-color="#1A5C4D"/>
    </linearGradient>
    <!-- Gold gradient for the mark -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D5A0"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#B8941F"/>
    </linearGradient>
    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded square (iOS-style 22.37% radius) -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow at top -->
  <ellipse cx="512" cy="300" rx="400" ry="200" fill="#C9A84C" opacity="0.06"/>

  <!-- MAIN MARK: Open Book / House Roof (unified symbol) -->
  <!-- The shape reads as both an open book (pages spreading from spine) and a house roof (peak at top) -->

  <!-- Left page / left roof slope -->
  <path d="M 512 280 L 512 560 L 270 620 L 250 540 Z" fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Right page / right roof slope -->
  <path d="M 512 280 L 512 560 L 754 620 L 774 540 Z" fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Center spine (peak of roof / spine of book) -->
  <rect x="504" y="280" width="16" height="280" fill="url(#goldGrad)"/>

  <!-- Page line details (visible at larger sizes, disappear at small) -->
  <line x1="350" y1="575" x2="490" y2="545" stroke="#0A4D5C" stroke-width="3" opacity="0.3"/>
  <line x1="360" y1="595" x2="490" y2="560" stroke="#0A4D5C" stroke-width="3" opacity="0.2"/>
  <line x1="674" y1="575" x2="534" y2="545" stroke="#0A4D5C" stroke-width="3" opacity="0.3"/>
  <line x1="664" y1="595" x2="534" y2="560" stroke="#0A4D5C" stroke-width="3" opacity="0.2"/>

  <!-- FAMILY: two simplified figures (gold dots) below the book/roof -->
  <circle cx="440" cy="700" r="32" fill="url(#goldGrad)"/>
  <circle cx="584" cy="700" r="32" fill="url(#goldGrad)"/>

  <!-- Simplified bodies (curved arcs below heads) -->
  <path d="M 400 760 Q 440 730 480 760" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 544 760 Q 584 730 624 760" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Base line (ground / foundation) -->
  <rect x="320" y="800" width="384" height="4" rx="2" fill="url(#goldGrad)" opacity="0.4"/>
</svg>
